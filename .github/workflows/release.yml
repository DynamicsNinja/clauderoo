name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test clauderoo.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($project in 'Clauderoo.Cli', 'Clauderoo.Tray') {
            dotnet publish "src/$project" -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false `
              -p:Version=$version -p:ClauderooRepo=${{ github.repository }} -o publish
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $project" }
          }
          Copy-Item publish/clauderoo.exe publish/cr.exe

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "clauderoo-$version-win-x64.zip"
          Compress-Archive -Path publish/clauderoo.exe, publish/cr.exe, publish/clauderoow.exe, LICENSE, README.md -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  # Sends the new version to microsoft/winget-pkgs as a PR. Its own job, so a winget problem never marks the release
  # itself as failed. Skipped (with a notice) for pre-releases, when the WINGET_TOKEN secret isn't set, and while the
  # package isn't in winget yet: wingetcreate can only update a package that exists. See packaging/README.md.
  winget:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - name: Submit to winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = 'DynamicsNinja.clauderoo'
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice::WINGET_TOKEN isn't set, so this release wasn't sent to winget."
            exit 0
          }
          gh api "repos/microsoft/winget-pkgs/contents/manifests/d/DynamicsNinja/clauderoo" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::notice::$id isn't in winget yet (the first version must be accepted by hand), so this release wasn't sent."
            exit 0
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:GITHUB_REF_NAME)/clauderoo-$version-win-x64.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update $id --version $version --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }
